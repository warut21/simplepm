version: '3.8'

services:
  db:
    image: mysql:8.0 # Using a specific recent version
    container_name: project_mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword # Please change this in a real production environment
      MYSQL_DATABASE: project_db
      MYSQL_USER: project_user
      MYSQL_PASSWORD: project_password # Please change this in a real production environment
    ports:
      - "3306:3306" # Map host port 3306 to container port 3306
    volumes:
      - mysql_data:/var/lib/mysql # Persist database data

volumes:
  mysql_data:
